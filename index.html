<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=b, initial-scale=1.0" />
    <link rel="stylesheet" href="12-rock-paper-scissors.css" />
    <title>Rock Paper Scissors</title>
  </head>

  <body>
    <div>
      <p class="title">Rock, Paper, Scissors</p>
      <!-- Random number generator -- selects a random number from 0 to 1 using decimals. Can think of as percentages 0% - 100% -->
      <!-- Make it so each option has a 33% chance of being picked -->
      <button class="move-button js-rock">
        <img src="images/rock-emoji.png" class="move-icon" alt="" />
      </button>
      <button class="move-button js-paper">
        <img src="images/paper-emoji.png" class="move-icon" alt="" />
      </button>
      <button class="move-button js-scissors">
        <img src="images/scissors-emoji.png" class="move-icon" alt="" />
      </button>
      <div class="result-container">
        <p class="js-result result"></p>
        <p class="js-moves move"></p>

        <p class="js-score score">No score yet!</p>
      </div>

      <!--Reset Button has its own JavaScript to reset score, delete any locally stored data, and update score  -->
      <button class="reset-btn js-reset-button">Reset Score</button>
      <button class="auto-play-button js-auto-play-button">Autoplay</button>
      <div class="confirmation-text"></div>
    </div>

    <script src="12-rock-paper-scissors.js"></script>
  </body>
</html>
